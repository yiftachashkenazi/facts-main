services:
  - type: web
    name: fact-checking-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python startup.py
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    disk:
      name: fact-checking-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
